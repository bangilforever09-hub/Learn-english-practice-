name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan kunci tanda tangan tetap
        run: |
          base64 -d debug.keystore.b64 > debug.keystore
          keytool -list -keystore debug.keystore -storepass android | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: learn-english-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Catat sidik jari APK
        continue-on-error: true
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"
